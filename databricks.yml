# This is a Declarative Automation Bundle definition for nyc_data_analysis_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_data_analysis_project
  uuid: 622034b5-2964-490f-be13-acff2bd95d08

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b31a694d-1da3.cloud.databricks.com
    variables:
      catalog: hive_metastore
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-b31a694d-1da3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/samarth.bhatt@rearc.io to make sure we only have a single copy.
      root_path: /Workspace/Users/samarth.bhatt@rearc.io/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hive_metastore
      schema: prod
    permissions:
      - user_name: samarth.bhatt@rearc.io
        level: CAN_MANAGE
