# The main pipeline for nyc_data_analysis_project

resources:
  pipelines:
    nyc_data_analysis_project_etl:
      name: nyc_data_analysis_project_etl
      # Catalog is required for serverless compute
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/nyc_data_analysis_project_etl"

      libraries:
        - glob:
            include: ../src/nyc_data_analysis_project_etl/transformations/**

      configuration:
        # Where the Yellow Taxi parquet files are landed (see src/nyc_data_analysis_project/main.py)
        # before this pipeline reads them.
        source_volume_path: /Volumes/${var.catalog}/${var.schema}/nyc_data_volume
        # Disable Lakeflow's automatic retries (platform defaults: 5 update retries,
        # 2 flow retries) so a genuine failure (e.g. a code bug) fails fast instead
        # of silently retrying the same root cause for several minutes first.
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
