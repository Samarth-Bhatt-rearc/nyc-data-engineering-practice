# A sample job for nyc_data_analysis_project.

resources:
  jobs:
    nyc_data_analysis_project_job:
      name: nyc_data_analysis_project_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: landing_data_task
          python_wheel_task:
            package_name: nyc_data_analysis_project
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: landing_data_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.nyc_data_analysis_project_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
